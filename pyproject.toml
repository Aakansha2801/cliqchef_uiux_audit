[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cliqchef-uiux-audit"
version = "1.0.0"
description = "Industry-standard UI/UX testing suite for CliqChef.ai using Playwright + Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CliqChef QA Team"}]

dependencies = [
    "playwright>=1.48.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.5.0",
    "pytest-xdist>=3.6.0",
    "pytest-html>=4.1.0",
    "pytest-asyncio>=0.24.0",
    "allure-pytest>=2.13.0",
    "Pillow>=10.4.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["pages*", "helpers*", "tests*"]

# ─── Pytest Configuration ───

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--maxfail=5",
    "-p", "no:cacheprovider",
]
markers = [
    "smoke: smoke tests (critical path, fast)",
    "critical: critical business-flow tests",
    "accessibility: WCAG 2.1 accessibility tests",
    "visual: visual regression & snapshot tests",
    "responsive: responsive design / viewport tests",
    "performance: performance & Core Web Vitals tests",
    "navigation: navigation & routing tests",
    "forms: form interaction & validation tests",
    "content: content quality & SEO tests",
    "ux: UX interaction & usability tests",
    "mobile: mobile-specific tests",
    "desktop: desktop-specific tests",
    "slow: slow-running tests (>10s)",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"

# ─── Ruff (Linter + Formatter) ───

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pages", "helpers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["playwright.*", "PIL.*"]
ignore_missing_imports = true
