name: UI/UX Audit — Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run full audit nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─── Lint & Type Check ───
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check pages/ helpers/ tests/
      - name: Ruff format check
        run: ruff format --check pages/ helpers/ tests/
      - name: MyPy type check
        run: mypy pages/ helpers/ --ignore-missing-imports
        continue-on-error: true

  # ─── Install Playwright Browsers ───
  install-browsers:
    name: Cache Playwright Browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e .
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium firefox webkit
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-v1

  # ─── Accessibility Tests ───
  accessibility:
    name: Accessibility Tests
    needs: [lint, install-browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium
      - name: Run accessibility tests
        run: |
          pytest tests/accessibility/ \
            --browser chromium \
            --headed \
            -m accessibility \
            --junitxml=reports/accessibility-junit.xml \
            --html=reports/accessibility-report.html \
            --self-contained-html
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: reports/

  # ─── Visual Regression Tests ───
  visual:
    name: Visual Regression Tests
    needs: [lint, install-browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium
      - name: Run visual tests
        run: |
          pytest tests/visual/ \
            --browser chromium \
            --headed \
            -m visual \
            --junitxml=reports/visual-junit.xml \
            --html=reports/visual-report.html \
            --self-contained-html
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: reports/

  # ─── Performance Tests ───
  performance:
    name: Performance Tests
    needs: [lint, install-browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium
      - name: Run performance tests
        run: |
          pytest tests/performance/ \
            --browser chromium \
            --headed \
            -m performance \
            --junitxml=reports/performance-junit.xml \
            --html=reports/performance-report.html \
            --self-contained-html
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: reports/

  # ─── Responsive Tests ───
  responsive:
    name: Responsive Design Tests
    needs: [lint, install-browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium
      - name: Run responsive tests
        run: |
          pytest tests/responsiveness/ \
            --browser chromium \
            --headed \
            -m responsive \
            --junitxml=reports/responsive-junit.xml \
            --html=reports/responsive-report.html \
            --self-contained-html
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-report
          path: reports/

  # ─── Full Test Suite ───
  full-audit:
    name: Full UI/UX Audit
    needs: [lint, install-browsers]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium firefox webkit
      - name: Run full audit across all browsers
        run: |
          pytest \
            --browser chromium \
            --browser firefox \
            --browser webkit \
            --headed \
            --junitxml=reports/full-junit.xml \
            --html=reports/full-report.html \
            --self-contained-html \
            | tee reports/test-output.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-report
          path: reports/

  # ─── Summary ───
  summary:
    name: Audit Summary
    needs: [accessibility, visual, performance, responsive]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## UI/UX Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Responsive | ${{ needs.responsive.result }} |" >> $GITHUB_STEP_SUMMARY
